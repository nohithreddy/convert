name: daily
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append daily log entry
        run: |
          echo "Daily run - $(date -u +'%Y-%m-%d %H:%M UTC')" >> DAILY_LOG.md
      - name: Commit and push
        run: |
          git config user.name "nohithreddy"
          git config user.email "desireddy.mahi.2002@gmail.com"
          git add DAILY_LOG.md
          git commit -m "chore: daily log $(date -u +'%Y-%m-%d')"
          git push
